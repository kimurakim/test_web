<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR 코드 스캐너</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f9f9f9; }
        main { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #reader { width: 100%; border: 2px solid #4CAF50; border-radius: 8px; overflow: hidden; }
        #result { margin-top: 20px; font-size: 16px; font-weight: bold; color: #333; word-break: break-all; }
        .loading { color: #666; font-style: italic; }
    </style>
</head>
<body>

<main>
    <h2>QR 코드 스캐너 테스트</h2>
    <p>카메라 권한을 허용하고 QR 코드를 화면에 보여주세요.</p>
    
    <div id="reader"></div>
    
    <div id="result" class="loading">스캔 대기 중...</div>
</main>

<script>
    // QR 스캔 성공 시 실행될 함수
    function onScanSuccess(decodedText, decodedResult) {
        // 스캔 반복을 막기 위해 스캐너 일시 정지 또는 종료
        html5QrcodeScanner.clear();
        
        document.getElementById('result').innerText = "인식 성공! 이동 중: " + decodedText;
        document.getElementById('result').style.color = "#4CAF50";

        // 💡 핵심: 스캔된 내용이 http로 시작하는 URL 주소라면 해당 사이트로 자동 이동
        if (decodedText.startsWith('http://') || decodedText.startsWith('https://')) {
            setTimeout(() => {
                window.location.href = decodedText; // 현재 창에서 이동
                // 만약 새 창으로 열고 싶다면 아래 코드를 사용하세요.
                // window.open(decodedText, '_blank');
            }, 1000); // 1초 뒤 이동
        } else {
            // URL이 아니라 일반 텍스트인 경우 안내 메시지 출력
            document.getElementById('result').innerText = "인식된 텍스트: " + decodedText + " (올바른 URL 주소가 아닙니다.)";
            document.getElementById('result').style.color = "#ff0000";
        }
    }

    // QR 스캔 실패 시 실행될 함수 (매 프레임 스캔 실패할 때마다 호출되므로 보통 비워둡니다)
    function onScanFailure(error) {
        // console.warn(`QR 스캔 실패: ${error}`);
    }

    // 4. 스캐너 객체 생성 및 실행 (초당 10프레임 인식 시도)
    let html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", 
        { fps: 10, qrbox: {width: 250, height: 250} },
        /* verbose= */ false
    );
    
    html5QrcodeScanner.render(onScanSuccess, onScanFailure);
</script>

</body>
</html>
